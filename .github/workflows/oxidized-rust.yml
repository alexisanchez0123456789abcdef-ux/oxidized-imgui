name: oxidized-rust

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/oxidized-rust.yml"
  pull_request:
    paths:
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Status panel is up to date
        run: pwsh -NoProfile -File tools/progress/report.ps1 -Check
